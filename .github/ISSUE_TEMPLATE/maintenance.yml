name: Tâche de maintenance
description: Tâche d'organisation ou de maintenance (équipe)
title: "[CHORE] "
labels: ["status: triage"]
body:
  - type: textarea
    id: task
    attributes:
      label: Tâche
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critère d'acceptation
      description: Comment vérifier que la tâche est terminée ?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Domaine
      options:
        - GitHub
        - Discord
        - Resources
        - Projects
        - Activities
        - Governance
